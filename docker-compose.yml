services:
  selenium:
      profiles: ["tools"]
      image: selenium/standalone-chromium:4.44.0-20260505
      shm_size: 2gb
      ports:
        - "4444:4444"
        - "7900:7900"
      environment:
        SE_NODE_SESSION_TIMEOUT: 86400
        SE_SESSION_REQUEST_TIMEOUT: 120
        SE_SESSION_RETRY_INTERVAL: 2
        SE_SCREEN_WIDTH: 1440
        SE_SCREEN_HEIGHT: 1100
      healthcheck:
        test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
        interval: 5s
        timeout: 5s
        retries: 20

  selenium-scraper:
    profiles: ["tools"]
    build:
      context: ./scrape
      dockerfile: Dockerfile
    depends_on:
      selenium:
        condition: service_started
    environment:
      SELENIUM_REMOTE_URL: http://selenium:4444
      SCRAPER_TIMEZONE: Asia/Manila
      FB_EMAIL: ${FB_EMAIL:-}
      FB_PASSWORD: ${FB_PASSWORD:-}
    volumes:
      - ./scrape/output:/app/output
      - ./scrape/fb_page_scraper:/app/fb_page_scraper:ro
    stdin_open: true
    tty: true

  scraper-api:
    profiles: ["tools"]
    build:
      context: ./scrape
      dockerfile: Dockerfile
    depends_on:
      selenium:
        condition: service_started
    entrypoint:
      - uvicorn
      - fb_page_scraper.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8010:8000"
    environment:
      SELENIUM_REMOTE_URL: http://selenium:4444
      SCRAPER_TIMEZONE: Asia/Manila
      FB_EMAIL: ${FB_EMAIL:-}
      FB_PASSWORD: ${FB_PASSWORD:-}
    volumes:
      - ./scrape/output:/app/output
      - ./scrape/fb_page_scraper:/app/fb_page_scraper:ro
  directus:
    image: directus/directus:11.17.4
    container_name: chishub-directus
    restart: unless-stopped
    ports:
      - "8056:8055"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SECRET: ${DIRECTUS_SECRET:-0a4a174b-37aa-4bec-a61e-e3aa5ca6fcf3}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@chishub.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-d1r3ctu5}
      DB_CLIENT: pg
      DB_HOST: ${POSTGRES_HOST:-host.docker.internal}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_DATABASE: ${POSTGRES_DATABASE:-chis_hub}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      PUBLIC_URL: ${PUBLIC_DIRECTUS_URL:-http://localhost:8056}
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${WEB_PUBLIC_URL:-http://localhost:3001}
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
    volumes:
      - ./directus/uploads:/directus/uploads
      - ./directus/extensions:/directus/extensions
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8055/server/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DIRECTUS_URL: ${PUBLIC_DIRECTUS_URL:-http://localhost:8055}
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
    container_name: chishub
    restart: unless-stopped
    # depends_on:
    #   directus:
    #     condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      DIRECTUS_URL: http://directus:8056
      NEXT_PUBLIC_DIRECTUS_URL: ${PUBLIC_DIRECTUS_URL:-http://localhost:8056}
      DIRECTUS_STATIC_TOKEN: ${DIRECTUS_STATIC_TOKEN:-}
      DIRECTUS_ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@chishub.com}
      DIRECTUS_ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-d1r3ctu5}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-replace-with-a-long-random-secret}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      APP_VERSION: ${APP_VERSION:-1}
